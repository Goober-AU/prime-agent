name: Publish TelemusAI main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: telemusai-main-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'telemusai/prime-agent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PRIME_AGENT_CODING_AGENT_DIR: ${{ runner.temp }}/prime-main-checks
      PRIME_AGENT_BOOTSTRAP_KERNEL_ON_INSTALL: '0'
      PRIME_AGENT_BOOTSTRAP_TOOLS_ON_INSTALL: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install locked dependencies
        run: |
          npm install --global npm@11.10.0
          npm ci

      - name: Compile packages
        run: |
          ./node_modules/.bin/tsgo -p packages/tui/tsconfig.build.json
          ./node_modules/.bin/tsgo -p packages/ai/tsconfig.build.json
          ./node_modules/.bin/tsgo -p packages/agent/tsconfig.build.json
          ./node_modules/.bin/tsgo -p packages/coding-agent/tsconfig.build.json
          npm run copy-assets --workspace=@earendil-works/pi-coding-agent
          npm run bundle --workspace=@earendil-works/pi-coding-agent

      - name: Check source and updater
        run: |
          npm run check
          git diff --exit-code
          cd packages/coding-agent
          npx tsx ../../node_modules/vitest/dist/cli.js --run test/version-check.test.ts test/release-pack.test.ts test/package-self-update-daemon.test.ts test/config.test.ts test/node-version-check.test.ts test/interactive-update-relaunch.test.ts

      - name: Pack main build
        id: build
        run: |
          source_version=$(node -p "require('./package.json').version")
          commit_count=$(git rev-list --count HEAD)
          version="${source_version}-telemusai.main.${commit_count}.g${GITHUB_SHA:0:9}"
          node scripts/pack-prime-agent-release.mjs \
            --github-repository "$GITHUB_REPOSITORY" \
            --channel main --version "$version" \
            --out-dir packages/coding-agent/release/telemusai-main
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish complete main release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.build.outputs.version }}
        run: |
          latest_main=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$latest_main" != "$GITHUB_SHA" ]; then
            echo "A newer main commit is queued; skipping publication of this build."
            exit 0
          fi
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This main build is already published."
            exit 0
          fi
          artifacts=packages/coding-agent/release/telemusai-main/artifacts
          (cd "$artifacts" && sha256sum --check SHA256SUMS)
          printf 'Main build from [%s](https://github.com/%s/commit/%s).\n\nInstall updates with `/update` or `prime-agent update`.\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA" > "$RUNNER_TEMP/main-release-notes.md"
          gh release create "$tag" "$artifacts"/*.tgz "$artifacts/SHA256SUMS" "$artifacts/main.json" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Main ${RELEASE_VERSION}" --latest \
            --notes-file "$RUNNER_TEMP/main-release-notes.md"
