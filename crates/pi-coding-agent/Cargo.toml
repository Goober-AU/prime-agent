[package]
name = "pi-coding-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
regex = { workspace = true }
anyhow = { workspace = true }
indexmap = { workspace = true }
serde_yaml = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
tempfile = { workspace = true }
zip = { workspace = true }
libc = { version = "0.2", optional = true }
pi-ai = { workspace = true }
pi-agent-core = { workspace = true }
pi-tui = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Security"] }

[[bin]]
name = "optimus-rust"
path = "src/bin/optimus_rust.rs"
